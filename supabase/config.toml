project_id = "interact"

[api]
schemas = ["public", "graphql_public", "interact"]

[functions.create-session]
verify_jwt = false

[functions.participant-action]
verify_jwt = false

[functions.presenter-action]
verify_jwt = false

[functions.analyze-question]
verify_jwt = false

[functions.analyze-session]
verify_jwt = false

[functions.generate-exit-ticket]
verify_jwt = false

[functions.shorten-url]
verify_jwt = false

[functions.openai-realtime-session]
verify_jwt = false

# InterAct hardening: every browser signs in anonymously so row-level security
# can scope reads to the sessions it belongs to. A whole class joins from one
# campus IP, so the default 30/hour anonymous sign-in cap would lock students out.
[auth]
enable_anonymous_sign_ins = true

[auth.rate_limit]
anonymous_users = 500
